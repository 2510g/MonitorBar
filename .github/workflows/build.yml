name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the in-box C# compiler
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: MonitorBar
          path: dist/MonitorBar.exe
          if-no-files-found: error
